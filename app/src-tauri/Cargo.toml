[package]
name = "vibetotext"
version = "0.1.0"
description = "VibeToText - cross-platform push-to-talk transcription"
authors = ["VibeToText"]
edition = "2021"
rust-version = "1.77"
default-run = "vibetotext"

# The library that main.rs drives. Tauri v2 convention: app logic lives in a
# lib crate so it can also be reused by mobile/test targets.
[lib]
name = "vibetotext_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "vibetotext"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
# `tray-icon` gates the `tauri::tray` API used by `src/tray.rs` (Phase 1 system tray).
tauri = { version = "2.11", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.4"
tauri-plugin-window-state = "2.4"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Bundled SQLite so we don't depend on a system libsqlite3 across OSes.
# Pinned to 0.39 (libsqlite3-sys 0.37): rusqlite 0.40 pulls libsqlite3-sys
# 0.38 whose build.rs uses cfg_select!, which requires Rust >=1.95; we build
# on stable 1.94.1. Revisit when the toolchain moves to >=1.95.
rusqlite = { version = "0.39", features = ["bundled"] }

# Resolves ~/.vibetotext and per-OS config/data dirs.
dirs = "6.0"

anyhow = "1.0"
thiserror = "2.0"

# Phase 2 audio + transcription.
# cpal 0.17.3 pinned (spike-confirmed known-good, plan §3). WASAPI verified on
# Windows; CoreAudio (macOS) / ALSA (Linux) written-but-unverified here.
cpal = "0.17.3"
# FFT for the waveform band-mapping (25 bars), matching recorder.py.
rustfft = "6.4"
# Local whisper.cpp bindings. CPU default features (CPU-only MVP); GPU backends are
# opt-in via the metal/cuda/vulkan cargo features below. 0.16 pinned (plan §3).
whisper-rs = "0.16"
# Model download-on-first-run (models.rs). Blocking client; rustls-tls avoids a
# system OpenSSL dependency on Linux. 0.13 matches the copy tauri already pulls.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# GPU acceleration is scaffolded but OFF by default (CPU-only MVP). Each flag
# forwards to the matching whisper-rs backend feature; opt-in builds only.
[features]
default = []
metal = ["whisper-rs/metal"]
cuda = ["whisper-rs/cuda"]
vulkan = ["whisper-rs/vulkan"]
# Feature-gated localhost HTTP transcription endpoint (Phase 5).
local-api = []

[profile.release]
# whisper.cpp + rusqlite bundled builds benefit from LTO; keep panic=abort
# off so tracing can capture backtraces in crash logging.
codegen-units = 1
lto = true
