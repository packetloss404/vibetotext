[package]
name = "vibetotext"
version = "0.1.0"
description = "VibeToText - cross-platform push-to-talk transcription"
authors = ["Ian Walmsley", "dyoburon"]
edition = "2021"
rust-version = "1.94"
default-run = "vibetotext"

# The library that main.rs drives. Tauri v2 convention: app logic lives in a
# lib crate so it can also be reused by mobile/test targets.
[lib]
name = "vibetotext_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "vibetotext"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
# `tray-icon` gates the `tauri::tray` API used by `src/tray.rs` (Phase 1 system tray).
# `macos-private-api` is required because tauri.conf.json sets app.macOSPrivateApi=true
# (transparent/click-through overlay window, Phase 3); tauri-build validates that the
# config allowlist matches the enabled cargo features.
tauri = { version = "2.11", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-single-instance = "2.4"
tauri-plugin-window-state = "2.4"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
atomic-write-file = "0.3"

# Bundled SQLite so we don't depend on a system libsqlite3 across OSes.
# Pinned to 0.39 (libsqlite3-sys 0.37): rusqlite 0.40 pulls libsqlite3-sys
# 0.38 whose build.rs uses cfg_select!, which requires Rust >=1.95; we build
# on stable 1.94.1. Revisit when the toolchain moves to >=1.95.
rusqlite = { version = "0.39", features = ["bundled"] }

# Resolves ~/.vibetotext and per-OS config/data dirs.
dirs = "6.0"

anyhow = "1.0"
thiserror = "2.0"
phf = { version = "0.11", features = ["macros"] }

# Phase 2 audio + transcription.
# cpal 0.17.3 pinned (spike-confirmed known-good, plan §3). WASAPI verified on
# Windows; CoreAudio (macOS) / ALSA (Linux) written-but-unverified here.
cpal = "0.17.3"
# FFT for the waveform band-mapping (25 bars), matching recorder.py.
rustfft = "6.4"
# Local whisper.cpp bindings. CPU default features (CPU-only MVP); GPU backends are
# opt-in via the metal/cuda/vulkan cargo features below. 0.16 pinned (plan §3).
whisper-rs = "0.16"
# Model download-on-first-run (models.rs). Blocking client; rustls-tls avoids a
# system OpenSSL dependency on Linux. 0.13 matches the copy tauri already pulls.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
sha1 = "0.10"

# Phase 3 hotkeys + paste.
# Global low-level key listener for the push-to-talk chord state machine
# (hotkey.rs). 0.5.3 spike-pinned (plan §3) — `listen` is X11-only on Linux and
# needs macOS Accessibility; abstracted behind a trait for a later Wayland swap.
# Windows verified by the spike; macOS/Linux written-but-unverified here.
rdev = "0.5.3"
# Cross-platform input simulation for auto-paste (paste.rs). Always copy-to-
# clipboard first so a paste failure degrades to manual paste (port of
# output.py fallback semantics).
enigo = "0.6"
# Clipboard access for the paste fallback path (paste.rs).
arboard = "3.6"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
wait-timeout = "0.2"

# Phase 5 feature-gated localhost HTTP transcription endpoint (local_api.rs).
# Optional: only compiled in when the `local-api` cargo feature is enabled, so a
# default build pulls in no extra HTTP server. tiny_http is a tiny, blocking,
# dependency-light server — bound to 127.0.0.1 loopback only for security.
tiny_http = { version = "0.12", optional = true }
base64 = { version = "0.22", optional = true }

# Windows-only: resolve full WASAPI capture-endpoint names ("Headset (PLT Focus)")
# for the mic picker, since cpal reports generic short names ("Headset"). The
# crate is already in the dependency tree via tauri/wry (0.61); this just enables
# the audio-enumeration features. See audio/devices.rs::full_endpoint_names.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Media_Audio",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_Devices_FunctionDiscovery",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_Foundation",
] }

# GPU acceleration is scaffolded but OFF by default (CPU-only MVP). Each flag
# forwards to the matching whisper-rs backend feature; opt-in builds only.
[features]
# rdev-backend activates the real rdev global-hotkey listener (hotkey/mod.rs).
# On by default; building without it falls back to a no-op backend, which is the
# seam for swapping in a hotkey-listener/evdev backend for native Wayland later.
default = ["rdev-backend"]
rdev-backend = []
metal = ["whisper-rs/metal"]
cuda = ["whisper-rs/cuda"]
vulkan = ["whisper-rs/vulkan"]
# Feature-gated localhost HTTP transcription endpoint (Phase 5). Off by default;
# pulls in the optional `tiny_http` dep only when explicitly enabled.
local-api = ["dep:tiny_http", "dep:base64"]

[profile.release]
# whisper.cpp + rusqlite bundled builds benefit from LTO; keep panic=abort
# off so tracing can capture backtraces in crash logging.
codegen-units = 1
lto = true
